<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TFG Anvil Calculator</title>
    <script type="module" crossorigin src="/tfg-anvil-calculator/assets/index-m5y3v8Do.js"></script>
    <link rel="stylesheet" crossorigin href="/tfg-anvil-calculator/assets/index-3qZOuPq5.css">
  </head>
  <body>
    <div id="app">
      <h1>TFG Anvil Calculator<sup class="modpack-version">for v0.13.6</sup></h1>

      <section class="panel">
        <label for="preset-name">Save current as preset</label>
        <div class="save-preset">
          <input type="text" id="preset-name" placeholder="Preset name" />
          <button id="save-preset" type="button">Save</button>
        </div>

        <details id="custom-preset-group" class="preset-group" hidden open>
          <summary class="preset-group__label">Custom</summary>
          <div class="scrollable-row">
            <ul id="custom-presets-list" class="preset-list"></ul>
            <div id="custom-presets-scrollbar" class="scrollbar scrollbar--vertical" hidden>
              <div class="scrollbar__thumb"></div>
            </div>
          </div>
        </details>
      </section>

      <section class="panel">
        <label for="world-seed">World seed</label>
        <input type="text" id="world-seed" placeholder="Enter your world seed to unlock built-in presets" />

        <details id="builtin-preset-group" class="preset-group" open hidden>
          <summary class="preset-group__label">Built-in</summary>
          <ul id="builtin-category-row" class="category-row"></ul>
          <div id="builtin-category-scrollbar" class="scrollbar scrollbar--horizontal" hidden>
            <div class="scrollbar__thumb"></div>
          </div>
          <ul id="builtin-subcategory-row" class="category-row" hidden></ul>
          <div id="builtin-subcategory-scrollbar" class="scrollbar scrollbar--horizontal" hidden>
            <div class="scrollbar__thumb"></div>
          </div>
          <ul id="builtin-presets-grid" class="preset-grid"></ul>
        </details>
      </section>

      <section class="panel">
        <label>Trailing actions</label>
        <div class="last-actions">
          <div class="last-actions__slot">
            <label for="last-action-2">Last</label>
            <select id="last-action-2" class="action-select"></select>
          </div>
          <div class="last-actions__slot">
            <label for="last-action-1">Second Last</label>
            <select id="last-action-1" class="action-select"></select>
          </div>
          <div class="last-actions__slot">
            <label for="last-action-0">Third Last</label>
            <select id="last-action-0" class="action-select"></select>
          </div>
        </div>
      </section>

      <section class="panel">
        <label for="start-value">Start value</label>
        <input type="number" id="start-value" value="0" min="0" max="145" />
        <input type="range" id="start-value-slider" class="target-slider" value="0" min="0" max="145" step="1" />
      </section>

      <section class="panel">
        <label for="target">Target value</label>
        <input type="number" id="target" value="0" min="0" max="145" />
        <input type="range" id="target-slider" class="target-slider" value="0" min="0" max="145" step="1" />
      </section>

      <button id="calculate" type="button">Calculate</button>

      <hr id="divider" class="divider" hidden />

      <section id="result" class="result" hidden></section>

      <footer class="footer">
        <a href="https://github.com/Vajkis/tfg-anvil-calculator" target="_blank" rel="noopener" class="footer__link" aria-label="GitHub repository" data-tooltip="GitHub repository">
          <img src="/tfg-anvil-calculator/svg/icon-github.svg" alt="GitHub" />
        </a>
        <a href="https://www.paypal.com/donate/?hosted_button_id=UT5NEX6JVGDBW" target="_blank" rel="noopener" class="footer__link" aria-label="Donate via PayPal" data-tooltip="Donate via PayPal">
          <img src="/tfg-anvil-calculator/svg/icon-paypal.svg" alt="PayPal" />
        </a>
      </footer>
    </div>
  </body>
</html>
